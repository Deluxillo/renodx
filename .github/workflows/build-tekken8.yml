name: Build Tekken 8 (hue slider)

on:
  workflow_dispatch:
  push:
    branches: [tekken8-hue-slider, tekken8-hue-slider-1029]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up shader tools
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\scripts\setup-dev-env.ps1 -Update -Tools dxc,slang,glslang,spirv-tools

      - name: Set up Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: latest
          platform: x64

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Configure CMake
        run: cmake --preset clang-x64

      - name: Build only tekken8
        run: cmake --build --preset clang-x64-release --target tekken8 --verbose

      - name: Upload addon
        uses: actions/upload-artifact@v4
        with:
          name: renodx-tekken8-hueslider
          path: build/**/renodx-tekken8.addon64
          if-no-files-found: error
